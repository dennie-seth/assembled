[project]
name = "lora-train"
version = "0.1.0"
description = "SDXL style LoRA corpus curation and training tooling (T-0072, 13-asset-pipeline.md §3.2)"
requires-python = ">=3.11"
# No generative-model or GPU deps here — this package handles corpus
# curation, manifest validation, config validation, and building the
# sd-scripts CLI invocation. The actual training run (accelerate launch
# sdxl_train_network.py) needs a CUDA torch + kohya sd-scripts stack,
# which is WSL-native but deliberately kept out of this package's own
# deps (GPU-specific cu12x wheels don't belong in a plain editable dev
# install) — see setup-training-env.sh + training-requirements.txt.
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest==8.3.5",
    "ruff==0.11.2",
]

[project.scripts]
lora-fetch = "lora_train.fetch:main"
lora-train = "lora_train.train:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
