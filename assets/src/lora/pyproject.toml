[project]
name = "lora-train"
version = "0.1.0"
description = "SDXL style LoRA corpus curation and training tooling (T-0072, 13-asset-pipeline.md §3.2)"
requires-python = ">=3.11"
# No generative-model or GPU deps here — this package handles corpus
# curation, manifest validation, and config validation only.
# The actual training run (accelerate launch train_network.py) depends on
# diffusers + accelerate + bitsandbytes, installed separately on the GPU box.
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest==8.3.5",
    "ruff==0.11.2",
]

[project.scripts]
lora-fetch = "lora_train.fetch:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
