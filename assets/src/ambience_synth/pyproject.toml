[project]
name = "ambience-synth"
version = "0.1.0"
description = "Deterministic looping ambience bed synthesis for archetype beds (T-0202, 13-asset-pipeline.md §4.3/§4.7)"
requires-python = ">=3.12"
dependencies = [
  "numpy==2.5.1",
  "scipy==1.18.0",
  "soundfile==0.14.0",
  "pyloudnorm==0.2.0",
  "mutagen==1.47.0",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "ruff==0.14.4",
]

[project.scripts]
ambience-synth = "ambience_synth.pipeline:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
