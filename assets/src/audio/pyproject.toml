[project]
name = "sfx-synth"
version = "0.1.0"
description = "Deterministic one-shot SFX synthesis (T-0101, docs/design/13-asset-pipeline.md §4.5)"
requires-python = ">=3.12"
dependencies = [
  "numpy==2.5.1",
  "scipy==1.18.0",
  "soundfile==0.14.0",
  "pyloudnorm==0.2.0",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "ruff==0.14.4",
]

[project.scripts]
sfx-synth = "sfx_synth.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
