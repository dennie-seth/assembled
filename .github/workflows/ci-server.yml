name: ci-server

on:
  pull_request:
    branches: [develop, main]
    paths:
      - "server/**"
      - "shared/**"
      - ".github/workflows/ci-server.yml"
  push:
    branches: [develop, main]
    paths:
      - "server/**"
      - "shared/**"
      - ".github/workflows/ci-server.yml"
  # Lets release.yml call this workflow on a version-tag push to reuse the
  # cmake build + ctest job verbatim instead of duplicating it. Purely
  # additive: doesn't change push/pull_request behavior above.
  workflow_call:

concurrency:
  group: ci-server-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: cmake build + ctest
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: assembled
          POSTGRES_PASSWORD: assembled
          POSTGRES_DB: assembled_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Read by MigrationRunner/Database and by the migration integration
      # test (server/test/migration_test.cpp); the test is skipped, not
      # failed, if this is ever unset.
      DATABASE_URL: postgresql://assembled:assembled@localhost:5432/assembled_test
    steps:
      - uses: actions/checkout@v4

      # T-0040: Drogon comes from Ubuntu's own package archive (noble
      # universe), not vcpkg/Conan -- see server/README.md "Dependency
      # manager" for the full rationale. This is the exact package set
      # `find_package(Drogon CONFIG)` needs to resolve on this runner.
      - name: Install Drogon + Postgres client + build deps (apt)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libdrogon-dev libjsoncpp-dev libpq-dev uuid-dev zlib1g-dev \
            libsqlite3-dev libmariadb-dev libbrotli-dev libhiredis-dev \
            libyaml-cpp-dev

      # T-0034: caches CMake's FetchContent downloads (doctest). No
      # vcpkg/conan cache needed now that Drogon comes from apt (T-0040).
      - uses: actions/cache@v4
        with:
          path: server/build/_deps
          key: cmake-deps-${{ runner.os }}-${{ hashFiles('server/CMakeLists.txt') }}

      - name: Configure
        run: cmake -S server -B server/build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build server/build --parallel

      - name: Test
        working-directory: server/build
        run: ctest --output-on-failure

      # T-0035: server binary is now real (T-0040+); still uploading
      # server_tests too since it's what a reviewer would rerun locally.
      - uses: actions/upload-artifact@v4
        with:
          name: server-binary
          path: |
            server/build/server
            server/build/migrate
            server/build/server_tests
          if-no-files-found: error
