name: ci-character

on:
  pull_request:
    branches: [develop, main]
    paths:
      - "assets/src/character/**"
      - "tools/asset-gate/src/**"
      - "assets/src/lora/src/**"
      - "assets/final/palette/**"
      - ".github/workflows/ci-character.yml"
  push:
    branches: [develop, main]
    paths:
      - "assets/src/character/**"
      - "tools/asset-gate/src/**"
      - "assets/src/lora/src/**"
      - "assets/final/palette/**"
      - ".github/workflows/ci-character.yml"

concurrency:
  group: ci-character-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: assets/src/character

jobs:
  lint-test:
    name: lint, test (clean install, T-0363)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Deliberately char-gen's OWN pyproject.toml only -- pillow + numpy,
      # no editable install of tools/asset-gate. conftest.py sys.path-injects
      # tools/asset-gate/src (and assets/src/lora/src) instead of requiring a
      # separate install step; this job is what actually proves that wiring
      # collects and runs cleanly from a genuinely clean venv, which no CI
      # workflow did before T-0363 (Codex review, 2026-09-11).
      - run: pip install -e ".[dev]"

      - run: ruff check .

      # T-0363 investigation (see assets/src/character/CI_KNOWN_FAILURES_T0363.md):
      # a clean run of this suite is 17 failed / 131 errors even on develop,
      # unrelated to and pre-dating this card -- committed v2 entity sheets
      # that open as 'RGB' instead of the indexed 'P' mode several gate
      # fixtures assert, a genuinely absent
      # player_profile_keyframe_hybrid_T0272.provenance.json, a stale
      # committed gate report, and four pre-existing frame_consistency
      # deltas. Fixing any of those means regenerating shipped art through
      # ComfyUI, which this test-hygiene card must not do (it may not
      # ready/run/re-scope any GPU or asset-generation work). The exact 148
      # node ids excluded below (one per line, not whole files -- several of
      # these modules have currently-passing tests alongside the broken
      # ones, e.g. test_gate_report_T0349.py is 6 green / 1 red) live in
      # tests/T0363_KNOWN_FAILING_IDS.txt, verified to match this branch's
      # own pytest run exactly (17 failed + 131 errors = 148 lines), so a
      # future card can pick any one up individually instead of this job
      # quietly widening or silently dropping coverage it doesn't need to.
      #
      # CI fix round (2026-09-17): this checkout's actions/checkout@v4 step
      # deliberately does not set `lfs: true` (no LFS fetch bandwidth spent
      # on every run), so assets/final/lora/*.safetensors are un-fetched Git
      # LFS pointer files here. The six tests that read those bytes
      # (test_weights_file_is_valid_safetensors / test_weights_hash_matches_
      # provenance across T0229/T0248/profile_T0274) detect the pointer via
      # tests/lfs_pointer.py and SKIP rather than fail -- they are not in
      # T0363_KNOWN_FAILING_IDS.txt and are not deselected; they still run
      # and assert in full wherever the real weights file is present (a
      # local run, or the reviewer's own checkout). Fetching LFS objects in
      # CI to get full coverage here is a separate decision for a human.
      - name: pytest -q
        run: |
          mapfile -t deselect < <(sed 's/^/--deselect=/' tests/T0363_KNOWN_FAILING_IDS.txt)
          pytest -q "${deselect[@]}"

      # T-0363 AC: a full character test session must never write into the
      # committed assets/final tree. conftest.py used to auto-synthesize any
      # missing shipped sheet directly into assets/final/character and
      # assets/final/entity (removed in T-0363, see
      # tests/test_conftest_no_synthesis_T0363.py) -- this is the CI-side
      # backstop so a regression of that hazard fails the PR instead of
      # merging silently. `if: always()` so this still runs (and can still
      # fail the job) even if ruff or pytest above already failed -- the
      # write-into-assets/final hazard is independent of whether the suite
      # itself is green, and a step gated behind earlier failures never
      # proves anything.
      - name: assets/final must be unchanged after the test session
        if: always()
        run: |
          cd "$GITHUB_WORKSPACE"
          if [ -n "$(git status --porcelain assets/final)" ]; then
            echo "character test session wrote into assets/final:"
            git status --porcelain assets/final
            exit 1
          fi
