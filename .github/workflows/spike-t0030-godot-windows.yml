name: spike-t0030-godot-windows

# T-0030: SPIKE, not a permanent CI gate. Run on demand (Actions tab ->
# Run workflow) to (re)confirm windows-latest can build godot-cpp via
# SCons/MSVC and run `godot --headless --export-release`. See
# docs/ci-notes.md for context and how to record the result.
#
# SUPERSEDED (T-0060, 2026-08-02): the real Phase 5 client now lives at
# client/ and ci-client.yml builds/exports it on every push and PR. This
# workflow is kept only as an on-demand, disposable-project sanity check —
# it is not part of the regular gate. Prefer ci-client.yml for anything
# that needs to reflect the real client.
on:
  workflow_dispatch: {}

env:
  GODOT_VERSION: "4.7.1"
  # godot-cpp lags the engine's own release cadence - as of this pin there
  # is no 4.6/4.7 branch or tag yet, only up to the 4.5 line (confirmed via
  # `git ls-remote --heads/--tags https://github.com/godotengine/godot-cpp`).
  # This is a concrete, immutable tag, not a moving branch. Bump once
  # godot-cpp cuts a ref that actually matches GODOT_VERSION's line.
  GODOT_CPP_REF: "godot-4.5-stable"

jobs:
  godot-cpp-scons-build:
    name: "(a) godot-cpp SCons/MSVC build"
    runs-on: windows-latest
    env:
      SCONS_CACHE: ${{ github.workspace }}/.scons-cache
    steps:
      - name: Checkout godot-cpp
        uses: actions/checkout@v7
        with:
          repository: godotengine/godot-cpp
          ref: ${{ env.GODOT_CPP_REF }}
          submodules: recursive
          path: godot-cpp-spike

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - uses: actions/cache@v6
        with:
          path: ${{ env.SCONS_CACHE }}
          key: scons-cache-windows-godot-cpp-${{ env.GODOT_CPP_REF }}-${{ github.sha }}
          restore-keys: |
            scons-cache-windows-godot-cpp-${{ env.GODOT_CPP_REF }}-

      - run: pip install scons

      - name: Build godot-cpp (template_release, MSVC)
        working-directory: godot-cpp-spike
        run: scons platform=windows target=template_release -j2

  godot-headless-export:
    name: "(b) godot --headless --export-release"
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
          include-templates: true

      - name: Import project (headless)
        shell: bash
        working-directory: .github/ci-spike/godot-client
        run: godot --headless --import

      - name: Export Windows Desktop
        shell: bash
        working-directory: .github/ci-spike/godot-client
        run: |
          mkdir -p build/windows
          godot --headless --export-release "Windows Desktop" build/windows/assembled-ci-spike.exe
