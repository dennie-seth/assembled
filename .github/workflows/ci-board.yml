name: ci-board

on:
  pull_request:
    branches: [develop, main]
    paths:
      - "tools/board/**"
      - ".github/workflows/ci-board.yml"
  push:
    branches: [develop, main]
    paths:
      - "tools/board/**"
      - ".github/workflows/ci-board.yml"

concurrency:
  group: ci-board-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: tools/board

jobs:
  lint-test-build:
    name: lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: tools/board/package-lock.json

      - run: npm ci

      - run: npm run lint

      - run: npm test

      - run: npm run build
