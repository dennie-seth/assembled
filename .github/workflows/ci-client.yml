name: ci-client

on:
  pull_request:
    branches: [develop, main]
    paths:
      - "client/**"
      - ".github/workflows/ci-client.yml"
  push:
    branches: [develop, main]
    paths:
      - "client/**"
      - ".github/workflows/ci-client.yml"

concurrency:
  group: ci-client-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # T-0060: engine and godot-cpp are pinned to different lines on purpose.
  # godot-cpp lags the engine's release cadence and, as of this pin, only
  # publishes up to the 4.5 line (no 4.6/4.7 branch or tag — confirmed via
  # `git ls-remote --heads/--tags https://github.com/godotengine/godot-cpp`).
  # This is safe: Godot's GDExtension ABI has been forward-compatible across
  # 4.x minor releases since 4.1 (`compatibility_minimum` in the
  # .gdextension file), and this was verified directly, not assumed — see
  # docs/ci-notes.md T-0060 for how. Bump GODOT_CPP_REF once godot-cpp cuts
  # a ref matching GODOT_VERSION's line, and re-verify.
  GODOT_VERSION: "4.7.1"
  GODOT_CPP_REF: "godot-4.5-stable"
  CLIENT_DIR: client

jobs:
  windows-export:
    name: "Windows: godot-cpp build + headless export"
    runs-on: windows-latest
    env:
      SCONS_CACHE: ${{ github.workspace }}/.scons-cache
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      # SCons content-addressed cache dir (T-0034), so a source-identical
      # rebuild reuses prior objects instead of recompiling godot-cpp. This
      # is the slow leg of the job (~10-15 min cold) — expected.
      - uses: actions/cache@v6
        with:
          path: ${{ env.SCONS_CACHE }}
          key: scons-cache-windows-godot-cpp-${{ env.GODOT_CPP_REF }}-${{ github.sha }}
          restore-keys: |
            scons-cache-windows-godot-cpp-${{ env.GODOT_CPP_REF }}-

      - run: pip install scons

      - name: Build assembled_client GDExtension (template_debug, MSVC)
        working-directory: ${{ env.CLIENT_DIR }}
        run: scons platform=windows target=template_debug -j2

      - name: Build assembled_client GDExtension (template_release, MSVC)
        working-directory: ${{ env.CLIENT_DIR }}
        run: scons platform=windows target=template_release -j2

      - uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
          include-templates: true
          cache: true

      - name: Import project (headless)
        shell: bash
        working-directory: ${{ env.CLIENT_DIR }}
        run: godot --headless --import

      - name: Smoke test — GDExtension loads and round-trips (headless)
        shell: bash
        working-directory: ${{ env.CLIENT_DIR }}
        run: godot --headless --script tests/smoke_test.gd

      - name: Export Windows Desktop
        shell: bash
        working-directory: ${{ env.CLIENT_DIR }}
        run: |
          mkdir -p build/windows
          godot --headless --export-release "Windows Desktop" build/windows/assembled.exe

      - uses: actions/upload-artifact@v7
        with:
          name: client-windows-export
          path: ${{ env.CLIENT_DIR }}/build/windows
          if-no-files-found: error

  linux-export:
    name: "Linux: godot-cpp build + headless export"
    runs-on: ubuntu-latest
    env:
      SCONS_CACHE: ${{ github.workspace }}/.scons-cache
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - uses: actions/cache@v6
        with:
          path: ${{ env.SCONS_CACHE }}
          key: scons-cache-linux-godot-cpp-${{ env.GODOT_CPP_REF }}-${{ github.sha }}
          restore-keys: |
            scons-cache-linux-godot-cpp-${{ env.GODOT_CPP_REF }}-

      - run: pip install scons

      - name: Build assembled_client GDExtension (template_debug)
        working-directory: ${{ env.CLIENT_DIR }}
        run: scons platform=linux target=template_debug -j$(nproc)

      - name: Build assembled_client GDExtension (template_release)
        working-directory: ${{ env.CLIENT_DIR }}
        run: scons platform=linux target=template_release -j$(nproc)

      - uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
          include-templates: true
          cache: true

      - name: Import project (headless)
        working-directory: ${{ env.CLIENT_DIR }}
        run: godot --headless --import

      - name: Smoke test — GDExtension loads and round-trips (headless)
        working-directory: ${{ env.CLIENT_DIR }}
        run: godot --headless --script tests/smoke_test.gd

      - name: Export Linux
        working-directory: ${{ env.CLIENT_DIR }}
        run: |
          mkdir -p build/linux
          godot --headless --export-release "Linux" build/linux/assembled.x86_64

      - uses: actions/upload-artifact@v7
        with:
          name: client-linux-export
          path: ${{ env.CLIENT_DIR }}/build/linux
          if-no-files-found: error
