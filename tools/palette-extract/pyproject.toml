[project]
name = "palette-extract"
version = "0.1.0"
description = "T-0105: cluster an approved concept sheet -> value ramp -> locked home-palette LUT (docs/design/13-asset-pipeline.md §6.10)"
requires-python = ">=3.12"
dependencies = [
  "pillow==12.3.0",
  "numpy==2.5.1",
  "scipy==1.18.0",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "ruff==0.14.4",
]

[project.scripts]
palette-extract = "palette_extract.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
