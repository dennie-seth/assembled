[project]
name = "comfy-client"
version = "0.1.0"
description = "ComfyUI HTTP client + recipe->workflow layer driving the AssetAgent (T-0071, docs/design/13-asset-pipeline.md)"
requires-python = ">=3.12"
dependencies = [
  "requests==2.32.3",
  "Pillow==11.0.0",
  "numpy==2.5.1",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "responses==0.25.3",
  "ruff==0.14.4",
]

[project.scripts]
comfy-client = "comfy_client.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
comfy_client = ["templates/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
