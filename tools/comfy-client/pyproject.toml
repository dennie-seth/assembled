[project]
name = "comfy-client"
version = "0.1.0"
description = "ComfyUI HTTP client + recipe->workflow layer driving the AssetAgent (T-0071, docs/design/13-asset-pipeline.md)"
requires-python = ">=3.12"
dependencies = [
  "requests==2.32.3",
  "Pillow==11.0.0",
  "numpy==2.5.1",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "responses==0.25.3",
  "ruff==0.14.4",
]

[project.scripts]
comfy-client = "comfy_client.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
comfy_client = ["templates/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# gen-client-base is a sibling monorepo package; pip can't resolve relative
# file: URIs on Linux, so we add its src tree to sys.path for pytest runs.
# Install it editably first if you need it outside of pytest:
#   pip install -e ../gen-client-base
# asset-gate is on this path too: provenance_sidecar.py reuses its
# check_provenance_generator_resolvable predicate rather than restating the
# resolvability rule, so the writer and the CI gate cannot drift apart.
pythonpath = ["../gen-client-base/src", "../asset-gate/src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["comfy_client"]
known-third-party = ["gen_client_base"]
